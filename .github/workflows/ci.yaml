name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  DATABASE_URL: sqlite:////tmp/llm-data/llm.db
  LLM_DATA_DIR: /tmp/llm-data

jobs:
  cli:
    name: CLI (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust check
        working-directory: ${{ github.workspace }}/crates
        run: cargo check --workspace --all-targets

      - name: Run Rust tests
        working-directory: ${{ github.workspace }}/crates
        run: cargo test --workspace

      - name: Build CLI binary
        working-directory: ${{ github.workspace }}/crates
        run: cargo build --release -p llm-cli

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-cli-linux
          path: ${{ github.workspace }}/crates/target/release/llm
          retention-days: 7

  desktop-frontend:
    name: Desktop Frontend (Next.js build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install desktop dependencies
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend (out folder)
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run build

      - name: Upload frontend out folder
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-desktop-frontend-out
          path: ${{ github.workspace }}/packages/desktop/out
          retention-days: 7

  desktop-build:
    name: Desktop App (Tauri ${{ matrix.os }})
    needs: [desktop-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install desktop dependencies
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Download frontend out folder
        uses: actions/download-artifact@v7.0.3
        with:
          name: llm-desktop-frontend-out
          path: ${{ github.workspace }}/packages/desktop/out

      - name: Build Tauri app
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run build:tauri

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-desktop-${{ matrix.os }}
          path: ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/*
          retention-days: 7

  landing:
    name: Landing Page (Next.js + GitHub Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install landing dependencies
        working-directory: ${{ github.workspace }}/packages/landing
        run: pnpm install --frozen-lockfile

      - name: Build landing page
        working-directory: ${{ github.workspace }}/packages/landing
        run: pnpm run build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/packages/landing/out
          destination_dir: .

  release:
    name: Publish Release Artifacts
    needs: [cli, desktop-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Build CLI binary
        working-directory: ${{ github.workspace }}/crates
        run: cargo build --release -p llm-cli

      - name: Install desktop dependencies
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run build

      - name: Build Tauri app (all platforms)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload CLI binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/crates/target/release/llm
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
