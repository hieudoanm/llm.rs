name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite:////tmp/llm-data/llm.db
  LLM_DATA_DIR: /tmp/llm-data

jobs:
  cli-check:
    name: CLI check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Rust check
        working-directory: ${{ github.workspace }}/crates
        run: cargo check --workspace --all-targets

      - name: Run Rust tests
        working-directory: ${{ github.workspace }}/crates
        run: cargo test --workspace

  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-check` job.
    if: github.event_name != 'pull_request'
    needs: cli-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build CLI binary
        working-directory: ${{ github.workspace }}/crates
        run: cargo build --release -p llm-cli

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            ubuntu-latest) mv crates/target/release/llm dist/llm-x86_64-unknown-linux-gnu ;;
            macos-latest) mv crates/target/release/llm dist/llm-aarch64-apple-darwin ;;
            windows-latest) mv crates/target/release/llm.exe dist/llm-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-cli-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install desktop dependencies
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run typecheck

      - name: Lint
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run lint

      - name: Test
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run test

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release bundles are only needed for the master-branch release job;
    # PRs are covered by the `desktop-check` job.
    if: github.event_name != 'pull_request'
    needs: desktop-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install desktop dependencies
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm exec tauri build --bundles app,dmg

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/macos
          app=$(ls -d *.app | head -n1)
          zip -r -X "${app%.app}.app.zip" "$app"

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-desktop-macos
          path: |
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-desktop-linux
          path: |
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-desktop-windows
          path: |
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ github.workspace }}/packages/landing

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  release:
    name: Release
    needs: [cli-build, desktop-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read release notes from README.md
        id: readme
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat README.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: llm-cli-*
          path: release-artifacts
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: llm-desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Delete existing "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Create "latest" Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: "llm.rs (latest)"
          body: ${{ steps.readme.outputs.body }}
          files: release-artifacts/**
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
