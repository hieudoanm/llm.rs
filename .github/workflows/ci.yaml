name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  DATABASE_URL: sqlite:////tmp/llm-data/llm.db
  LLM_DATA_DIR: /tmp/llm-data

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust check
        working-directory: ${{ github.workspace }}/crates
        run: cargo check --workspace --all-targets

      - name: Run Rust tests
        working-directory: ${{ github.workspace }}/crates
        run: cargo test --workspace

      - name: Build CLI binary
        working-directory: ${{ github.workspace }}/crates
        run: cargo build --release -p llm-cli

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-cli-linux
          path: ${{ github.workspace }}/crates/target/release/llm
          retention-days: 7

  desktop-build:
    name: App - Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install desktop dependencies
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run build

      - name: Build Tauri app
        working-directory: ${{ github.workspace }}/packages/desktop
        run: pnpm run build:tauri

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/macos
          zip -r -X LLM.app.zip LLM.app

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: llm-desktop-${{ matrix.os }}
          path: ${{ github.workspace }}/packages/desktop/src-tauri/target/release/bundle/*
          retention-days: 7

  landing:
    name: App - Landing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install landing dependencies
        working-directory: ${{ github.workspace }}/packages/landing
        run: pnpm install --frozen-lockfile

      - name: Build landing page
        working-directory: ${{ github.workspace }}/packages/landing
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hieudoanm.github.io/llm.rs

      - name: Reorganize output for basePath
        run: |
          mkdir -p ${{ github.workspace }}/packages/landing/out/llm.rs
          find ${{ github.workspace }}/packages/landing/out -maxdepth 1 -mindepth 1 ! -name llm.rs -exec mv {} ${{ github.workspace }}/packages/landing/out/llm.rs/ \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ github.workspace }}/packages/landing/out/llm.rs

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        id: deployment
        uses: actions/deploy-pages@v5.0.1

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

  release:
    name: Publish Release Artifacts
    needs: [cli, desktop-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read release notes from README.md
        id: readme
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat README.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download CLI artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: llm-cli-linux
          path: release-artifacts
          merge-multiple: true

      - name: Download macOS desktop artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: llm-desktop-macos-latest
          path: release-artifacts
          merge-multiple: true

      - name: Download Ubuntu desktop artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: llm-desktop-ubuntu-latest
          path: release-artifacts
          merge-multiple: true

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: llm-desktop-windows-latest
          path: release-artifacts
          merge-multiple: true

      - name: Delete existing "cli-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest --yes --cleanup-tag || true
          git push origin :refs/tags/cli-latest || true

      - name: Create/Update "cli-latest" Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: cli-latest
          name: "llm.rs (cli-latest)"
          body: ${{ steps.readme.outputs.body }}
          files: |
            release-artifacts/llm
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.zip
            release-artifacts/**/*.rpm
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
