[alias]
cov = "llvm-cov --workspace"
cov-html = "llvm-cov --workspace --html"
cov-lcov = "llvm-cov --workspace --lcov --output-path lcov.info"

[env]
cov = "llvm-cov --workspace --fail-under-lines 80 --fail-under-functions 80"
cov-html = "llvm-cov --workspace --html --fail-under-lines 80 --fail-under-functions 80"
cov-lcov = "llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80 --fail-under-functions 80"
