[workspace]
resolver = "2"
members = [
    "mlrs-core",
    "mlrs-db",
    "mlrs-api",
    "mlrs-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["mlrs contributors"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
linfa = "0.7"
linfa-trees = "0.7"
linfa-preprocessing = "0.7"
linfa-clustering = "0.7"
ndarray = "0.15"
ndarray-linalg = "0.15"
ndarray-rand = "0.1"
onnx-protobuf = "0.2.3"
polars = { version = "0.38", features = ["lazy", "serde", "csv"] }
polars-lazy = "0.38"
protobuf = "=3.7.2"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

mlrs-core = { path = "mlrs-core" }
mlrs-db = { path = "mlrs-db" }
mlrs-api = { path = "mlrs-api" }
mlrs-server = { path = "mlrs-server" }
