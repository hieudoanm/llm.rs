[workspace]
resolver = "2"
members = [
    "llm-core",
    "llm-db",
    "llm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["llm contributors"]

[workspace.dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["multipart"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
flate2 = "=1.1.10"
linfa = "=0.7.1"
linfa-trees = "=0.7.1"
linfa-preprocessing = "=0.7.1"
linfa-clustering = "=0.7.1"
ndarray = "=0.15.6"
ndarray-linalg = "=0.15.0"
ndarray-rand = "=0.1.1"
onnx-protobuf = "=0.2.3"
polars = { version = "=0.55.2", features = ["lazy", "serde", "csv"] }
polars-lazy = "=0.55.2"
protobuf = "=3.4.0"
rand = "=0.8.8"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tower = "=0.5.3"
tower-http = { version = "=0.6.11", features = ["cors", "compression-gzip", "trace"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate"] }

llm-core = { path = "llm-core" }
llm-db = { path = "llm-db" }
llm-cli = { path = "llm-cli" }

[workspace.metadata.coverage]
threshold = 80
