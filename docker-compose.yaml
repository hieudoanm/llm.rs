# Local, single-machine stack: Rust backend (SQLite) + Next.js frontend.
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend: http://127.0.0.1:3000 · API: http://127.0.0.1:8000 · Health: http://127.0.0.1:8000/healthz
# The backend persists datasets/artefacts/metrics in a SQLite file volume
# (`mlrs_data:/var/lib/mlrs`); point `DATABASE_URL` at another file to relocate it.
# See docs/11-deployment/local-development.md and docs/12-operations/.

name: mlrs

services:
  backend:
    container_name: mlrs-backend
    build:
      context: .
      dockerfile: crates/mlrs-server/Dockerfile
    environment:
      DATABASE_URL: sqlite:////var/lib/mlrs/mlrs.db
      MLRS_DATA_DIR: /var/lib/mlrs
      MLRS_MAX_UPLOAD_MB: ${MLRS_MAX_UPLOAD_MB:-10}
      MLRS_LOG_LEVEL: ${MLRS_LOG_LEVEL:-INFO}
      MLRS_CORS_ORIGINS: ${MLRS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MLRS_CORS_ALLOW_CREDENTIALS: ${MLRS_CORS_ALLOW_CREDENTIALS:-true}
      MLRS_ENABLE_INTERACTIVE_DOCS: ${MLRS_ENABLE_INTERACTIVE_DOCS:-true}
      MLRS_MAX_CONCURRENT_JOBS: ${MLRS_MAX_CONCURRENT_JOBS:-1}
      MLRS_JOB_TIMEOUT_SECONDS: ${MLRS_JOB_TIMEOUT_SECONDS:-1800}
      MLRS_JOB_MAX_ATTEMPTS: ${MLRS_JOB_MAX_ATTEMPTS:-2}
      MLRS_JOB_RETRY_BASE_SECONDS: ${MLRS_JOB_RETRY_BASE_SECONDS:-2}
      MLRS_WORKER_STALE_SECONDS: ${MLRS_WORKER_STALE_SECONDS:-3600}
      MLRS_RATE_LIMIT_ENABLED: ${MLRS_RATE_LIMIT_ENABLED:-true}
      MLRS_RATE_LIMIT_MAX_REQUESTS: ${MLRS_RATE_LIMIT_MAX_REQUESTS:-100}
      MLRS_RATE_LIMIT_WINDOW_SECONDS: ${MLRS_RATE_LIMIT_WINDOW_SECONDS:-60}
      MLRS_COMPRESSION_ENABLED: ${MLRS_COMPRESSION_ENABLED:-true}
      MLRS_COMPRESSION_MIN_SIZE: ${MLRS_COMPRESSION_MIN_SIZE:-500}
      MLRS_REQUEST_TIMEOUT_SECONDS: ${MLRS_REQUEST_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mlrs_data:/var/lib/mlrs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8000/healthz > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  frontend:
    container_name: mlrs-frontend
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_API_DOCS_URL: ${NEXT_PUBLIC_API_DOCS_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_API_DOCS_URL: ${NEXT_PUBLIC_API_DOCS_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mlrs_data:
