[package]
name = "llm-desktop"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
llm-core = { path = "../../../crates/llm-core" }
llm-db = { path = "../../../crates/llm-db" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
