<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-label="llm.rs — Machine Learning in Rust"
>
  <title>llm.rs — Machine Learning in Rust</title>
  <desc>
    Warm dark social card with an orange llm.rs mark, the tagline CSV in. ONNX out., and the
    local-first feature list.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1018" />
      <stop offset="55%" stop-color="#111923" />
      <stop offset="100%" stop-color="#1A2533" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(212 315) rotate(90) scale(320)">
      <stop offset="0%" stop-color="#F06B4D" stop-opacity=".24" />
      <stop offset="100%" stop-color="#F06B4D" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#24303D" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity=".22" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="24" y="24" width="1152" height="582" rx="32" fill="none" stroke="#24303D" />

  <ellipse
    cx="212"
    cy="315"
    rx="196"
    ry="72"
    transform="rotate(-25 212 315)"
    fill="none"
    stroke="#D67458"
    stroke-opacity=".35"
  />
  <ellipse
    cx="212"
    cy="315"
    rx="162"
    ry="56"
    transform="rotate(36 212 315)"
    fill="none"
    stroke="#8498AD"
    stroke-opacity=".2"
  />

  <g transform="translate(122 225)">
    <rect width="180" height="180" rx="52" fill="#F06B4D" />
    <line
      x1="138"
      y1="42"
      x2="42"
      y2="138"
      stroke="#0B1018"
      stroke-width="17"
      stroke-linecap="round"
    />
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="362" cy="246" r="5" fill="#F06B4D" />
    <text
      x="378"
      y="252"
      font-size="18"
      font-weight="700"
      letter-spacing="3.2"
      fill="#FFAC70"
    >MACHINE LEARNING IN RUST</text>

    <text
      x="356"
      y="352"
      font-size="92"
      font-weight="700"
      letter-spacing="-3"
      fill="#F7F1E8"
    >llm.rs</text>

    <text x="356" y="424" font-size="42">
      <tspan fill="#F7F1E8" font-weight="600">CSV in. </tspan>
      <tspan
        fill="#FFAC70"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="400"
      >ONNX out.</tspan>
    </text>

    <text x="356" y="478" font-size="24" fill="#9DA8B7">
      Train tabular models locally. Export portable ONNX.
    </text>

    <g font-size="20" fill="#9DA8B7">
      <text x="122" y="550">
        <tspan fill="#76D5A5" font-weight="700">✓</tspan> Six task types
      </text>
      <text x="312" y="550">
        <tspan fill="#76D5A5" font-weight="700">✓</tspan> ONNX export
      </text>
      <text x="492" y="550">
        <tspan fill="#76D5A5" font-weight="700">✓</tspan> Local-first
      </text>
    </g>

    <text x="1078" y="550" font-size="18" fill="#657184" text-anchor="end">
      github.com/hieudoanm/llm.rs
    </text>
  </g>

  <text x="1032" y="150" font-size="26" fill="#FFAC70">✦</text>
  <text x="1096" y="214" font-size="16" fill="#FFAC70">✦</text>
</svg>
